name: Build and Release APK

permissions:
  contents: write

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.keystore
          echo "Keystore decoded successfully"
        else
          echo "No keystore found, will use debug signing"
        fi

    - name: Build Release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        ./gradlew assembleRelease --stacktrace

    - name: Rename APKs
      run: |
        VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
        DATE=$(date +%Y%m%d)
        mkdir -p artifacts

        # Find release APK
        RELEASE_APK=""
        if [ -f app/build/outputs/apk/release/app-release.apk ]; then
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          SUFFIX="signed"
        elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
          RELEASE_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          SUFFIX="unsigned"
        fi

        if [ -z "$RELEASE_APK" ]; then
          echo "Error: Release APK not found"
          exit 1
        fi

        # Use ASCII-only filename: the runner locale mangles CJK characters
        APK_NAME="AIAccounting_v${VERSION}_${SUFFIX}_${DATE}.apk"
        cp "$RELEASE_APK" "artifacts/${APK_NAME}"

        # Calculate SHA256
        sha256sum "$RELEASE_APK" | awk '{print $1}' > "artifacts/${APK_NAME}.sha256"

        echo "APK_VERSION=${VERSION}" >> $GITHUB_ENV
        echo "APK_DATE=${DATE}" >> $GITHUB_ENV
        echo "APK_SUFFIX=${SUFFIX}" >> $GITHUB_ENV

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: artifacts/*.apk
        retention-days: 90

    - name: Upload SHA256 Checksum
      uses: actions/upload-artifact@v4
      with:
        name: checksums
        path: artifacts/*.sha256
        retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/checkout@v4

    - name: Download APKs
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ./artifacts/release-apk/*.apk
          ./artifacts/checksums/*.sha256
        body: |
          ## 🎉 AI记账 ${{ github.ref_name }}

          ### 📥 下载安装

          下载 `.apk` 文件到手机，点击安装即可。

          **系统要求**: Android 8.0+

          ### ✨ 主要功能

          - 🤖 AI 智能记账（自然语言识别）
          - 📷 OCR 票据识别
          - 🎤 语音记账
          - 📊 统计分析与可视化
          - 🔐 数据加密保护

          ### 🔐 安全验证

          下载后请验证 SHA256 校验和，确保文件完整性。

          ### 📝 更新日志

          详见 [commit 记录](https://github.com/gypg/ai-accounting-new/commits/main)
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
